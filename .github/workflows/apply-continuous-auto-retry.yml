name: Apply continuous blocked-task recovery

on:
  push:
    branches:
      - codex/continuous-auto-retry-20260918
    paths:
      - .github/workflows/apply-continuous-auto-retry.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/continuous-auto-retry-20260918
          fetch-depth: 0

      - name: Patch userscript and regression coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          script_path = Path('chatgpt-auto-confirm.user.js')
          test_path = Path('test/workbench.test.mjs')
          script = script_path.read_text()
          tests = test_path.read_text()

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, got {count}')
              return text.replace(old, new, 1)

          script = replace_once(script, '// @version      2.9.36', '// @version      2.9.37', 'metadata version')
          script = replace_once(script, "const VERSION = '2.9.36';", "const VERSION = '2.9.37';", 'runtime version')

          old_host = """  function taskCanBeRecoveredByHost(task) {
            return Boolean(task && (
              AUTO_RECOVERABLE_STATE_NAMES.has(String(task.state || ''))
              || (task.state === 'blocked' && (
                (task.attempted && task.token)
                || task.rendererRecoveryExhausted
                || task.attachmentUploadPending
              ))
            ));
          }"""
          new_host = """  function taskCanBeRecoveredByHost(task) {
            return Boolean(task && (
              AUTO_RECOVERABLE_STATE_NAMES.has(String(task.state || ''))
              || task.state === 'blocked'
            ));
          }"""
          script = replace_once(script, old_host, new_host, 'host recoverability')

          clear_match = re.search(r"(  function clearDispatchIntent\(task\) \{.*?\n  \})\n  function ", script, re.S)
          if not clear_match:
              raise SystemExit('clearDispatchIntent insertion point not found')
          helper = r'''
  function queueBlockedFreshRetry(task, reason = '任务进入需要处理状态') {
    if (!task || ['done', 'cancelled'].includes(task.state)) return '';
    const attempt = Number(task.blockedAutoRetryCount || 0) + 1;
    const detail = String(reason || '任务进入需要处理状态').trim() || '任务进入需要处理状态';
    task.blockedAutoRetryCount = attempt;
    task.lastBlockedReason = detail.slice(0, 1000);
    task.lastBlockedRecoveryAt = Date.now();
    clearDispatchIntent(task);
    task.noFinalReplyRecoveryUntil = 0;
    task.state = 'queued';
    delete task.pausedState;
    resetAmbiguousSendRecovery(task);
    resetAttachmentUploadState(task);
    observations.delete(task.id);
    log(task, `${detail}；已自动清理旧派发并切换到新的 ChatGPT 会话原样重发（自动恢复第 ${attempt} 次），不会停在“需要处理”。`);
    save();
    return 'queued';
  }
'''
          script = script[:clear_match.end(1)] + helper + '\n  function ' + script[clear_match.end():]

          old_state = """  function state(task, value, message) {
            if (task.state !== value) { task.state = value; log(task, message || statusNames[value]); }
          }"""
          new_state = """  function state(task, value, message) {
            if (value === 'blocked' && data.autoResume !== false) {
              const reason = message || statusNames[value];
              if (task.state !== 'blocked') { task.state = 'blocked'; log(task, reason); }
              queueBlockedFreshRetry(task, reason);
              return;
            }
            if (task.state !== value) { task.state = value; log(task, message || statusNames[value]); }
          }"""
          script = replace_once(script, old_state, new_state, 'blocked state interception')

          review_pattern = re.compile(r"    if \(attempts >= MAX_REVIEW_REPAIR_ATTEMPTS\) \{\n      task\.state = 'blocked';\n      log\(task, `\$\{reason\}；已达到 \$\{MAX_REVIEW_REPAIR_ATTEMPTS\} 次有限恢复上限。请检查验收会话后再恢复，已保留 Work 结果且不会重复执行。`\);\n      save\(\);\n      return 'blocked';\n    \}")
          review_replacement = """    if (attempts >= MAX_REVIEW_REPAIR_ATTEMPTS) {
              return queueBlockedFreshRetry(task, `${reason}；已达到 ${MAX_REVIEW_REPAIR_ATTEMPTS} 次当前会话修复上限`);
            }"""
          script, count = review_pattern.subn(review_replacement, script, count=1)
          if count != 1:
              raise SystemExit(f'review repair recovery: expected 1 match, got {count}')

          old_recover = """  function recoverPersistedBlockedTasks() {
            if (data.autoResume === false) return '';
            const task = tabTasks().find(item => item.state === 'blocked' && taskCanBeRecoveredByHost(item));
            if (!task || !prepareTaskForRecovery(task, { automatic:true })) return '';
            save();
            return task.id;
          }"""
          new_recover = """  function recoverPersistedBlockedTasks() {
            if (data.autoResume === false) return '';
            const task = tabTasks().find(item => item.state === 'blocked');
            if (!task) return '';
            queueBlockedFreshRetry(task, '检测到历史“需要处理”任务');
            return task.id;
          }"""
          script = replace_once(script, old_recover, new_recover, 'persisted blocked recovery')

          # Replace the legacy regression that intentionally preserved a terminal blocked task.
          old_idle_pattern = re.compile(r"test\('idle runner does not rewrite terminal error records into paused tasks',async\(\)=>\{.*?\n\}\);", re.S)
          idle_replacement = """test('persisted needs-processing task automatically opens a fresh retry instead of stopping',async()=>{
            const {h,w,dom}=await fixture();
            const task={id:'old-error',goal:'keep running',mode:'goal',phase:'work',round:1,state:'blocked',url:'https://chatgpt.com/c/old-error',token:'old-token',attempted:true,messages:[]};
            h.data.tasks.push(task);
            assert.equal(h.recoverPersistedBlockedTasks(),task.id);
            assert.equal(task.state,'queued');
            assert.equal(task.url,'');
            assert.equal(task.token,'');
            assert.equal(task.attempted,false);
            assert.match(task.messages.at(-1).text,/新的 ChatGPT 会话原样重发/);
            assert.doesNotMatch(h.data.tasks.map(item=>item.state).join(','),/blocked/);
            dom.window.close();
          });"""
          tests, count = old_idle_pattern.subn(idle_replacement, tests, count=1)
          if count != 1:
              raise SystemExit(f'idle blocked regression: expected 1 match, got {count}')

          # Missing navigation links used to surface a terminal manual-action state. They now requeue immediately.
          old_nav_pattern = re.compile(r"test\('missing sidebar links never create a four-attempt wait loop',async\(\)=>\{.*?\n\}\);", re.S)
          nav_replacement = """test('missing sidebar links automatically requeue in a fresh conversation',async()=>{
            const {h,w,dom}=await fixture();
            const task={id:'nav',state:'queued',messages:[]};
            const target=new w.URL('https://chatgpt.com/c/WEB:not-a-browser-session');
            assert.equal(h.queueNavigation(target,task),false);
            assert.equal(task.state,'queued');
            assert.equal(task.url,'');
            assert.equal(w.sessionStorage.getItem('fabushi-workbench-navigation-v2'),null);
            assert.ok(task.messages.some(message=>/新的 ChatGPT 会话原样重发/.test(message.text)));
            dom.window.close();
          });"""
          tests, count = old_nav_pattern.subn(nav_replacement, tests, count=1)
          if count != 1:
              raise SystemExit(f'navigation blocked regression: expected 1 match, got {count}')

          # Add an explicit regression for a new runtime blocker so the UI never persists “需要处理”.
          marker = "test('completion requires own final turn, stop absent, no approval and stable completion evidence',async()=>{"
          if marker not in tests:
              raise SystemExit('test insertion marker not found')
          added = """test('runtime blocked transition immediately becomes a fresh queued resend',async()=>{
            const {h,dom}=await fixture();
            const task={id:'runtime-blocked',goal:'continue forever',mode:'once',phase:'work',round:1,state:'waiting',url:'https://chatgpt.com/c/stuck',token:'dispatch-token',attempted:true,messages:[]};
            h.data.tasks.push(task);
            h.queueNavigation(new URL('https://chatgpt.com/c/WEB:missing'),task,'当前会话无法恢复');
            assert.equal(task.state,'queued');
            assert.equal(task.url,'');
            assert.equal(task.token,'');
            assert.equal(task.attempted,false);
            assert.match(task.messages.at(-1).text,/不会停在“需要处理”/);
            dom.window.close();
          });

"""
          tests = tests.replace(marker, added + marker, 1)

          script_path.write_text(script)
          test_path.write_text(tests)
          PY

          node --check chatgpt-auto-confirm.user.js
          grep -Fq "// @version      2.9.37" chatgpt-auto-confirm.user.js
          grep -Fq "不会停在“需要处理”" chatgpt-auto-confirm.user.js

      - name: Commit generated recovery patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add chatgpt-auto-confirm.user.js test/workbench.test.mjs
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "fix: continuously retry needs-processing tasks"
          git push origin HEAD:codex/continuous-auto-retry-20260918
