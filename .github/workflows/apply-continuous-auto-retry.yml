name: Apply continuous blocked-task recovery

on:
  push:
    branches:
      - codex/continuous-auto-retry-20260918
    paths:
      - .github/workflows/apply-continuous-auto-retry.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: codex/continuous-auto-retry-20260918
          fetch-depth: 0

      - name: Apply patch
        run: python3 tools/apply_continuous_retry.py

      - name: Syntax check
        run: node --check chatgpt-auto-confirm.user.js

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add chatgpt-auto-confirm.user.js test/workbench.test.mjs
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "fix: continuously retry needs-processing tasks"
          git push origin HEAD:codex/continuous-auto-retry-20260918
