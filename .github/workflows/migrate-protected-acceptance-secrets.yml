name: Migrate protected acceptance secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Migrate encrypted secrets to Android and iOS repositories
        env:
          GH_TOKEN: ${{ secrets.OFFICIAL_SITE_RELEASE_PAT }}
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FABUSHI_CI_TEST_USERNAME: ${{ secrets.FABUSHI_CI_TEST_USERNAME }}
          FABUSHI_CI_TEST_PASSWORD: ${{ secrets.FABUSHI_CI_TEST_PASSWORD }}
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          set_secret() {
            local repo="$1"
            local name="$2"
            local value="$3"
            if [[ -z "$value" ]]; then
              echo "$repo/$name=missing"
              return 1
            fi
            printf '%s' "$value" | gh secret set "$name" --repo "$repo" --body -
            echo "$repo/$name=written"
          }

          set_secret fabu-android/fabushi-android ANDROID_RELEASE_KEYSTORE_BASE64 "$ANDROID_RELEASE_KEYSTORE_BASE64"
          set_secret fabu-android/fabushi-android ANDROID_RELEASE_KEYSTORE_PASSWORD "$ANDROID_RELEASE_KEYSTORE_PASSWORD"
          set_secret fabu-android/fabushi-android ANDROID_RELEASE_KEY_ALIAS "$ANDROID_RELEASE_KEY_ALIAS"
          set_secret fabu-android/fabushi-android ANDROID_RELEASE_KEY_PASSWORD "$ANDROID_RELEASE_KEY_PASSWORD"
          set_secret fabu-android/fabushi-android FABUSHI_CI_TEST_USERNAME "$FABUSHI_CI_TEST_USERNAME"
          set_secret fabu-android/fabushi-android FABUSHI_CI_TEST_PASSWORD "$FABUSHI_CI_TEST_PASSWORD"

          set_secret fabushi-ios/fabushi-ios FABUSHI_CI_TEST_USERNAME "$FABUSHI_CI_TEST_USERNAME"
          set_secret fabushi-ios/fabushi-ios FABUSHI_CI_TEST_PASSWORD "$FABUSHI_CI_TEST_PASSWORD"
          set_secret fabushi-ios/fabushi-ios IOS_CERTIFICATE_P12_BASE64 "$IOS_CERTIFICATE_P12_BASE64"
          set_secret fabushi-ios/fabushi-ios IOS_CERTIFICATE_PASSWORD "$IOS_CERTIFICATE_PASSWORD"
          set_secret fabushi-ios/fabushi-ios IOS_PROVISIONING_PROFILE_BASE64 "$IOS_PROVISIONING_PROFILE_BASE64"
          set_secret fabushi-ios/fabushi-ios APP_STORE_CONNECT_API_KEY_ID "$APP_STORE_CONNECT_API_KEY_ID"
          set_secret fabushi-ios/fabushi-ios APP_STORE_CONNECT_API_ISSUER_ID "$APP_STORE_CONNECT_API_ISSUER_ID"
          set_secret fabushi-ios/fabushi-ios APP_STORE_CONNECT_API_KEY_BASE64 "$APP_STORE_CONNECT_API_KEY_BASE64"

          echo "android_secret_names:"
          gh secret list --repo fabu-android/fabushi-android --json name --jq '.[].name' | sort
          echo "ios_secret_names:"
          gh secret list --repo fabushi-ios/fabushi-ios --json name --jq '.[].name' | sort
