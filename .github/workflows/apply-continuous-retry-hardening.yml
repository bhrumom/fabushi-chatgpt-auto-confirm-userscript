name: Apply continuous retry hardening

on:
  push:
    branches:
      - codex/continuous-auto-retry-20260918
    paths:
      - .github/workflows/apply-continuous-retry-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python3 tools/harden_continuous_retry.py
      - run: node --check chatgpt-auto-confirm.user.js
      - shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add chatgpt-auto-confirm.user.js test/workbench.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "fix: keep blocked recovery automatic and bounded"
          git push origin HEAD:codex/continuous-auto-retry-20260918
