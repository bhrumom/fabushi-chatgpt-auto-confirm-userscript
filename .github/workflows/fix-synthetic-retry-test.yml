name: Align synthetic retry regression

on:
  push:
    branches:
      - codex/continuous-auto-retry-20260918
    paths:
      - .github/workflows/fix-synthetic-retry-test.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Update regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('test/workbench.test.mjs')
          s=p.read_text()
          old="""test('synthetic conversation URL stays on the current page without retrying',async()=>{
            const {h,w,dom}=await fixture();
            const task={id:'unverified',goal:'wait',state:'waiting',phase:'work',round:1,url:'https://chatgpt.com/c/WEB:not-in-sidebar',token:'owner',attempted:false,messages:[]};
            h.data.tasks.push(task);
            assert.equal(h.queueNavigation(new w.URL(task.url),task,'会话地址无效'),false);
            assert.equal(w.location.pathname,'/');
            assert.match(task.messages.at(-1).text,/请在任务中保留有效/);
            h.pause();
            dom.window.close();
          });"""
          new="""test('synthetic conversation URL automatically becomes a fresh resend',async()=>{
            const {h,w,dom}=await fixture();
            const task={id:'unverified',ownerTabId:h.getTabId(),goal:'wait',state:'waiting',phase:'work',round:1,url:'https://chatgpt.com/c/WEB:not-in-sidebar',token:'owner',attempted:false,messages:[]};
            h.data.tasks.push(task);
            assert.equal(h.queueNavigation(new w.URL(task.url),task,'会话地址无效'),false);
            assert.equal(w.location.pathname,'/');
            assert.equal(task.state,'queued');
            assert.equal(task.url,'');
            assert.equal(task.token,'');
            assert.equal(task.cooldownUntil,0);
            assert.match(task.messages.at(-1).text,/新的 ChatGPT 会话/);
            assert.match(task.messages.at(-1).text,/自动重发/);
            assert.doesNotMatch(task.messages.at(-1).text,/请在任务中保留有效/);
            h.pause();
            dom.window.close();
          });"""
          if s.count(old)!=1:
              raise SystemExit(f'expected one synthetic-route regression, got {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
      - name: Commit regression fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add test/workbench.test.mjs
          git commit -m "test: expect automatic synthetic-route recovery"
          git push origin HEAD:codex/continuous-auto-retry-20260918
