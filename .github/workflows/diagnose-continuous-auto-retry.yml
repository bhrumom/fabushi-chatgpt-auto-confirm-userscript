name: Diagnose and fix continuous auto-retry regression

on:
  push:
    branches:
      - codex/continuous-auto-retry-diagnostic-20260918

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          ref: codex/continuous-auto-retry-20260918
          fetch-depth: 0
      - name: Apply diagnosed fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('test/workbench.test.mjs')
          s=p.read_text()
          old="assert.match(task.messages.at(-1).text,/不会停在“需要处理”/);"
          new="assert.ok(task.messages.some(message=>/不会停在“需要处理”/.test(message.text)));"
          if s.count(old)!=1: raise SystemExit(f'blocked log assertion matches: {s.count(old)}')
          s=s.replace(old,new,1)
          old="assert.match(source,/^\\/\\/ @version\\s+2\\.9\\.36$/m);\n  assert.match(source,/const VERSION = '2\\.9\\.36'/);"
          new="assert.match(source,/^\\/\\/ @version\\s+2\\.9\\.37$/m);\n  assert.match(source,/const VERSION = '2\\.9\\.37'/);"
          if s.count(old)!=1: raise SystemExit(f'version assertion matches: {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
      - name: Commit fixes to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add test/workbench.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "test: align continuous retry regressions"
          git push origin HEAD:codex/continuous-auto-retry-20260918
