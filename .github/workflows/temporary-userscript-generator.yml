name: Temporary userscript generator
on:
  push:
    branches:
      - fix/work-final-report-repair-carry-v2.10.54
    paths:
      - 'src/**'
      - 'scripts/build-userscript.mjs'
      - 'package-lock.json'
permissions:
  contents: write
concurrency:
  group: temporary-userscript-generator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install build dependencies
        run: npm ci
      - name: Generate userscript in GitHub Actions
        run: npm run build
      - name: Commit generated userscript
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- chatgpt-auto-confirm.user.js; then
            echo "Generated userscript already matches source."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt-auto-confirm.user.js
          git commit -m "build: regenerate userscript bundle"
          git push origin "HEAD:${GITHUB_REF_NAME}"
