name: Publish userscript v2.9.36

on:
  push:
    branches:
      - release/v2.9.36-publish-20260917

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: 2fd43b6ba64a58acbc806ad35a4c48b477ac57f0
      TAG: v2.9.36
    steps:
      - name: Check out release branch
        uses: actions/checkout@v7
        with:
          ref: release/v2.9.36-publish-20260917
          fetch-depth: 0

      - name: Verify exact source and publish release
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$TARGET_SHA^{commit}"
          git show "$TARGET_SHA:chatgpt-auto-confirm.user.js" > /tmp/chatgpt-auto-confirm.user.js
          grep -Eq '^// @version[[:space:]]+2\.9\.36$' /tmp/chatgpt-auto-confirm.user.js
          grep -Fq "const VERSION = '2.9.36';" /tmp/chatgpt-auto-confirm.user.js
          node --check /tmp/chatgpt-auto-confirm.user.js
          echo "asset_size=$(wc -c < /tmp/chatgpt-auto-confirm.user.js)"
          sha256sum /tmp/chatgpt-auto-confirm.user.js
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; verifying target only."
            test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)" = "$TARGET_SHA"
          else
            gh release create "$TAG" /tmp/chatgpt-auto-confirm.user.js \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" \
              --title "v2.9.36 — bound conversation recovery" \
              --notes "修复原消息发送确认超过 90 秒时的恢复流程：若任务已有本轮绑定会话链接，优先跳转该会话并检查是否已结束或已有最终回复，再按现有任务流程继续，不会重复发送；若尚无可用绑定链接，保留派发标识并每 3 分钟刷新当前页面重新判断，连续 4 个恢复周期仍无法绑定时才新开 Work/规划会话原样重发。保留已绑定会话原有无限 3 分钟停滞刷新语义。"
          fi

      - name: Remove one-shot publisher from release branch
        shell: bash
        run: |
          rm .github/workflows/publish-v2936.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: remove v2.9.36 publisher"
          git push origin HEAD:release/v2.9.36-publish-20260917
