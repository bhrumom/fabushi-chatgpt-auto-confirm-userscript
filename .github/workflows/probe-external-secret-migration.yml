name: Probe external secret migration access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe repository secret administration without exposing credentials
        env:
          GH_TOKEN: ${{ secrets.OFFICIAL_SITE_RELEASE_PAT }}
        shell: bash
        run: |
          set +e
          android_code="$(gh api -i repos/fabu-android/fabushi-android/actions/secrets 2>/dev/null | sed -n '1s#HTTP/[0-9.]* \([0-9][0-9][0-9]\).*#\1#p')"
          ios_code="$(gh api -i repos/fabushi-ios/fabushi-ios/actions/secrets 2>/dev/null | sed -n '1s#HTTP/[0-9.]* \([0-9][0-9][0-9]\).*#\1#p')"
          [[ "$android_code" == "200" ]] && echo "android_secret_admin=available" || echo "android_secret_admin=unavailable"
          [[ "$ios_code" == "200" ]] && echo "ios_secret_admin=available" || echo "ios_secret_admin=unavailable"
