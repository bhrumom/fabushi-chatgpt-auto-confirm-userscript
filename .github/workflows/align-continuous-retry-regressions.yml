name: Align continuous retry regressions

on:
  push:
    branches:
      - codex/continuous-auto-retry-20260918
    paths:
      - .github/workflows/align-continuous-retry-regressions.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Align expectations with continuous recovery
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          attachment=Path('test/attachment-continuity.test.mjs')
          s=attachment.read_text()
          pattern=re.compile(r"test\('missing local attachment remains a manual-action blocker', async \(\) => \{.*?\n\}\);", re.S)
          replacement="""test('missing local attachment stays automatic and never becomes a manual-action blocker', async () => {
            const { dom, hooks } = await createHarness('<main><form><textarea id=\"prompt-textarea\"></textarea></form></main>');
            try {
              const task = { id: 'blocked-task', state: 'uploading', attachments: [{ name: 'missing.pdf' }], messages: [] };
              assert.equal(hooks.failAttachmentUpload(task, '本地附件“missing.pdf”已不存在，请重新选择。'), false);
              assert.equal(task.state, 'queued');
              assert.equal(task.attachmentUploadRetryAt, 0);
              assert.equal(task.url || '', '');
              assert.equal(task.token || '', '');
              assert.match(task.messages.at(-1).text, /新的 ChatGPT 会话/);
              assert.match(task.messages.at(-1).text, /自动重发/);
              assert.doesNotMatch(task.messages.at(-1).text, /停止发送纯文字目标/);
            } finally {
              dom.window.close();
            }
          });"""
          s,count=pattern.subn(replacement,s,count=1)
          if count != 1: raise SystemExit(f'attachment regression matches: {count}')
          attachment.write_text(s)

          review=Path('test/final-reply-handoff.test.mjs')
          s=review.read_text()
          old="""    assert.equal(hooks.queueReviewRepair(task, '验收回复 JSON 无法解析'), 'blocked');
    assert.equal(task.state, 'blocked');
    assert.equal(task.result, 'Work 已完成，不能重复执行。');"""
          new="""    assert.equal(hooks.queueReviewRepair(task, '验收回复 JSON 无法解析'), 'queued');
    assert.equal(task.state, 'queued');
    assert.equal(task.url, '');
    assert.equal(task.token, '');
    assert.equal(task.result, 'Work 已完成，不能重复执行。');
    assert.match(task.messages.at(-1).text, /新的 ChatGPT 会话/);
    assert.match(task.messages.at(-1).text, /自动重发/);"""
          if s.count(old) != 1: raise SystemExit(f'review regression matches: {s.count(old)}')
          review.write_text(s.replace(old,new,1))
          PY
          git diff --check
      - name: Commit aligned tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add test/attachment-continuity.test.mjs test/final-reply-handoff.test.mjs
          git commit -m "test: align continuous retry expectations"
          git push origin HEAD:codex/continuous-auto-retry-20260918
