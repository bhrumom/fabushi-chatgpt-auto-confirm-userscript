name: Apply ambiguous send bound recovery

on:
  push:
    branches:
      - fix/ambiguous-send-bound-conversation-recovery-20260917

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v7
        with:
          ref: fix/ambiguous-send-bound-conversation-recovery-20260917
          fetch-depth: 0

      - name: Apply deterministic recovery patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('chatgpt-auto-confirm.user.js')
          test_path = Path('test/workbench.test.mjs')
          source = source_path.read_text()
          tests = test_path.read_text()

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          source = replace_once(source, '// @version      2.9.35', '// @version      2.9.36', 'metadata version')
          source = replace_once(source, "  const VERSION = '2.9.35';", "  const VERSION = '2.9.36';", 'runtime version')

          source = replace_once(
              source,
              '  const STALLED_REFRESH_COOLDOWN_MS = STALLED_REFRESH_MS;\n',
              '  const STALLED_REFRESH_COOLDOWN_MS = STALLED_REFRESH_MS;\n'
              '  // An ambiguous Send click gets the same three-minute recovery cadence.\n'
              '  // Prefer a current-round bound conversation first; only an unbound send\n'
              '  // may eventually be redispatched after several page recovery cycles.\n'
              '  const AMBIGUOUS_SEND_REFRESH_MS = STALLED_REFRESH_MS;\n'
              '  const AMBIGUOUS_SEND_REFRESH_LIMIT = NO_FINAL_REPLY_RETRY_LIMIT;\n',
              'ambiguous recovery constants',
          )

          start = source.index('  function stopAmbiguousSend(task) {')
          end = source.index('  function noFinalReplyBackoffMs', start)
          new_recovery = '''  function resetAmbiguousSendRecovery(task) {
            if (!task) return;
            task.ambiguousSendRefreshAttempts = 0;
            task.ambiguousSendRefreshAt = 0;
          }
          function stopAmbiguousSend(task, perform = true, now = Date.now()) {
            const adoptedURL = adoptUnboundAttemptedConversation(task);
            if (adoptedURL) {
              task.attempted = false;
              task.dispatchOriginURL = '';
              task.dispatchStartedAt = 0;
              task.recoveryConfirmationStartedAt = 0;
              task.rendererRecoveryExhausted = false;
              task.routeRecoveryAttempts = 0;
              task.workspaceDocumentRecoveryAttempts = 0;
              resetAmbiguousSendRecovery(task);
              task.updatedAt = now;
              state(task, 'waiting', '已从当前唯一的新会话恢复本轮发送结果；沿用原发送标识和附件，开始检查最终回复，不会重复发送。');
              save();
              return true;
            }
            task.updatedAt = now;
            const boundURL = canonicalConversationURL(task.url);
            if (boundURL) {
              task.attempted = false;
              task.dispatchOriginURL = '';
              task.dispatchStartedAt = 0;
              task.recoveryConfirmationStartedAt = 0;
              task.rendererRecoveryExhausted = false;
              task.routeRecoveryAttempts = 0;
              task.workspaceDocumentRecoveryAttempts = 0;
              resetAmbiguousSendRecovery(task);
              task.state = 'waiting';
              log(task, '原消息发送确认超过 90 秒；已找到本轮绑定会话，优先回到该会话检查是否已结束或已有最终回复，再按回复结果继续下一步，不会重复发送。');
              save();
              if (perform && currentConversationURL() !== boundURL) directNavigate(new URL(boundURL), task);
              return true;
            }
            const attempts = Number(task.ambiguousSendRefreshAttempts || 0);
            const lastRefreshAt = Number(task.ambiguousSendRefreshAt || 0);
            if (lastRefreshAt && now - lastRefreshAt < AMBIGUOUS_SEND_REFRESH_MS) {
              task.state = 'sending';
              return false;
            }
            if (attempts >= AMBIGUOUS_SEND_REFRESH_LIMIT) {
              resetAmbiguousSendRecovery(task);
              return queueNoFinalReplyRetry(task, `原消息发送结果持续无法绑定本轮会话；已按每 3 分钟一次的间隔恢复 ${AMBIGUOUS_SEND_REFRESH_LIMIT} 次仍无法确认`);
            }
            const nextAttempt = attempts + 1;
            task.ambiguousSendRefreshAttempts = nextAttempt;
            task.ambiguousSendRefreshAt = now;
            task.state = 'sending';
            log(task, `原消息发送结果超过 90 秒仍无法确认，且尚无本轮绑定会话；正在刷新当前页面（第 ${nextAttempt}/${AMBIGUOUS_SEND_REFRESH_LIMIT} 次）。刷新后会重新判断当前页面和会话状态；若仍无法绑定，将每 3 分钟继续恢复，持续失败后自动新开会话原样重发。`);
            save();
            if (!perform) return true;
            navigating = true;
            try { location.reload(); } catch (error) {
              navigating = false;
              task.state = 'sending';
              log(task, `发送确认恢复刷新失败：${error.message}；已保留原发送标识，3 分钟后继续尝试。`);
              save();
              return false;
            }
            return true;
          }
'''
          source = source[:start] + new_recovery + source[end:]

          def patch_section(text, start_marker, end_marker, old, new, label):
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              section = text[start:end]
              section = replace_once(section, old, new, label)
              return text[:start] + section + text[end:]

          source = patch_section(
              source,
              '  function clearDispatchIntent(task) {',
              '  function queueNoFinalReplyRetry',
              '    task.workspaceDocumentRecoveryAttempts = 0;\n    resetAttachmentUploadState(task);',
              '    task.workspaceDocumentRecoveryAttempts = 0;\n    resetAmbiguousSendRecovery(task);\n    resetAttachmentUploadState(task);',
              'clear dispatch recovery state',
          )
          source = patch_section(
              source,
              '  async function send(task, signal) {',
              '  function reviewParseError',
              '    task.recoveryConfirmationStartedAt = 0;\n    task.sentAt = Date.now();',
              '    task.recoveryConfirmationStartedAt = 0;\n    resetAmbiguousSendRecovery(task);\n    task.sentAt = Date.now();',
              'new send recovery state',
          )
          source = patch_section(
              source,
              '  function finish(task, reply) {',
              '  async function inspect(task, signal) {',
              '    task.workspaceDocumentRecoveryAttempts = 0;\n    resetAttachmentUploadState(task);',
              '    task.workspaceDocumentRecoveryAttempts = 0;\n    resetAmbiguousSendRecovery(task);\n    resetAttachmentUploadState(task);',
              'finish recovery state',
          )
          source = patch_section(
              source,
              '    if (adoptedURL || knownURL) {',
              '    } else if (task.attempted && task.token) {',
              '      task.workspaceDocumentRecoveryAttempts = 0;\n      task.noFinalReplyRecoveryUntil = 0;',
              '      task.workspaceDocumentRecoveryAttempts = 0;\n      resetAmbiguousSendRecovery(task);\n      task.noFinalReplyRecoveryUntil = 0;',
              'resume known conversation recovery state',
          )

          old_test_start = "test('ambiguous send timeout preserves token and stops instead of creating another planner',async()=>{"
          old_test_end = "test('edited goal is persisted and replaces stale next-round instructions',async()=>{"
          test_start = tests.index(old_test_start)
          test_end = tests.index(old_test_end, test_start)
          new_tests = '''test('ambiguous send timeout prioritizes the current-round bound conversation before any resend',async()=>{
            const {h,w,dom}=await fixture();
            w.history.pushState({},'', '/c/other-conversation');
            const task={id:'sent-bound',goal:'review once',mode:'goal',round:1,state:'sending',phase:'review',url:'https://chatgpt.com/c/bound-conversation',token:'one-dispatch',attempted:true,sentAt:Date.now(),messages:[]};
            h.data.tasks.push(task);
            h.stopAmbiguousSend(task,false,1_000_000);
            assert.equal(task.state,'waiting');
            assert.equal(task.url,'https://chatgpt.com/c/bound-conversation');
            assert.equal(task.token,'one-dispatch');
            assert.equal(task.attempted,false);
            assert.match(task.messages.at(-1).text,/绑定会话/);
            assert.match(task.messages.at(-1).text,/最终回复/);
            dom.window.close();
          });
          test('unbound ambiguous send refreshes every three minutes and only then opens a fresh retry',async()=>{
            const {h,w,dom}=await fixture();
            w.history.pushState({},'', '/c/old-conversation');
            const task={id:'sent-unbound',goal:'review once',mode:'goal',round:1,state:'sending',phase:'review',url:'',token:'one-dispatch',attempted:true,dispatchOriginURL:'https://chatgpt.com/c/old-conversation',sentAt:1,messages:[]};
            h.data.tasks.push(task);
            h.stopAmbiguousSend(task,false,1_000_000);
            assert.equal(task.state,'sending');
            assert.equal(task.url,'');
            assert.equal(task.token,'one-dispatch');
            assert.equal(task.attempted,true);
            assert.equal(task.ambiguousSendRefreshAttempts,1);
            assert.equal(task.ambiguousSendRefreshAt,1_000_000);
            assert.match(task.messages.at(-1).text,/每 3 分钟/);
            h.stopAmbiguousSend(task,false,1_060_000);
            assert.equal(task.ambiguousSendRefreshAttempts,1,'cooldown prevents a rapid refresh loop');
            task.ambiguousSendRefreshAttempts=4;
            task.ambiguousSendRefreshAt=1_000_000;
            h.stopAmbiguousSend(task,false,1_180_001);
            assert.equal(task.state,'queued');
            assert.equal(task.url,'');
            assert.equal(task.token,'','a fresh retry gets a new dispatch token');
            assert.equal(task.attempted,false);
            assert.equal(task.noFinalReplyAttempts,1);
            assert.equal(task.ambiguousSendRefreshAttempts,0);
            assert.match(task.messages.at(-1).text,/新开 Work\/规划会话原样重发/);
            dom.window.close();
          });
          '''
          tests = tests[:test_start] + new_tests + tests[test_end:]

          if '2.9.35' in source.splitlines()[:25]:
              raise SystemExit('old version remains in header')
          source_path.write_text(source)
          test_path.write_text(tests)
          PY

      - name: Remove one-shot patch workflow
        run: rm .github/workflows/apply-ambiguous-send-bound-recovery.yml

      - name: Commit generated source changes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix: recover ambiguous sends through bound chats"
          git push origin HEAD:fix/ambiguous-send-bound-conversation-recovery-20260917
